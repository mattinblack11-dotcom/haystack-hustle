<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haystack Hustle</title>
<link rel="stylesheet" href="style.css?v=202610041522">
</head>
<body class="fp">
<canvas id="game"></canvas>

<div id="hud">
  <div id="topbar">
    <div id="stats">
      <div class="chip cash"><span class="ic" id="cashic"></span><span id="cash">0</span></div>
      <div class="chip gems"><span class="ic" id="gemic"></span><span id="gems">0</span></div>
      <div class="chip lvl" id="lvlchip"></div>
      <div class="bag">
        <div class="bag-top"><span>BAG</span><span id="bagtxt">0/30</span></div>
        <div class="bar"><div id="bagfill"></div></div>
      </div>
      <div id="boosts"></div>
      <div id="beginner" class="hidden"></div>
      <div id="quest" class="hidden"></div>
      <div id="rbready" class="hidden"></div>
    </div>
    <div id="center-top">
      <div id="objective"></div>
      <div id="objarrow" class="objarrow hidden"><div id="objarrow-icon"></div><div id="objarrow-text"></div></div>
      <div id="runinfo"><span id="timer">0:00</span> &middot; <span id="cleared">0%</span> cleared &middot; <span id="mapname"></span></div>
      <div id="storm"></div>
      <div id="toast"></div>
    </div>
    <div id="rightcol">
      <div id="buttons">
        <button class="hbtn shop" data-open="shop">SHOP <kbd>Tab</kbd></button>
        <button class="hbtn gem" data-open="gems">GEMS <kbd>G</kbd></button>
        <button class="hbtn style" data-open="style">STYLE <kbd>C</kbd></button>
        <button class="hbtn mp" data-open="mp">FRIENDS</button>
        <button class="hbtn" data-open="pause">&#9776;</button>
      </div>
      <button class="hbtn gift hidden" id="gift" data-open="gift"></button>
      <button class="hbtn boost adoffer" id="adoffer" data-open="adoffer"><span id="adoffer-ic"></span><span class="ao-txt"><small>FREE (watch ad)</small><b id="adoffer-name"></b></span><kbd>V</kbd></button>
      <div id="mphud" class="hidden"></div>
      <div id="combo" class="hidden"></div>
    </div>
  </div>
  <div id="sellhint" class="hidden"><kbd>F</kbd><span><b>SELL FROM HERE</b><small>Bag full! 20% fee</small></span></div>
  <div id="bottomleft">
    <div id="compass" class="hidden"><div id="compass-needle">&#11014;</div><span>NEEDLE</span></div>
    <div id="radar" class="hidden"><div class="radar-label">NEEDLE RADAR</div><div class="bar"><div id="radarfill"></div></div></div>
  </div>
  <div id="bottomstack">
    <div id="lockhint">Click to start digging &middot; mouse to look around</div>
    <div id="say"></div>
    <div id="heat" class="hidden"><div class="bar"><div id="heatfill"></div></div></div>
    <div id="jetfuel" class="hidden"><span>JETPACK</span><div class="bar"><div id="jetfill"></div></div></div>
    <div id="moneyrow">
      <div id="bigbag"><div id="bigbag-ic"></div><div class="bb-main"><div class="bb-top"><span id="bigbag-label">BAG</span><span id="bigbag-num">0</span></div><div class="bb-bar"><div id="bigbag-fill"></div></div></div></div>
    </div>
    <div id="hotbar"></div>
  </div>
</div>
<div id="crosshair"></div>
<div id="waypoint" class="marker hidden"><div class="wp-dot"></div><div class="wp-text"></div></div>
<div id="popups"></div>
<div id="flash"></div>
<div id="fullfx"></div>
<div id="overlay" class="hidden"><div id="panel"></div></div>
<div id="loading">
  <div class="load-box">
    <div class="load-title">HAYSTACK<br>HUSTLE</div>
    <div class="load-bale"></div>
    <div class="load-bar"><div id="load-fill"></div><div class="load-shine"></div><span id="load-pct">0%</span></div>
    <div id="load-text">Stacking hay...</div>
    <div id="load-tip"></div>
  </div>
</div>
<script>(function () { var s = 0; function t() { if (window.__loadTaken) return; var f = document.getElementById("load-fill"), p = document.getElementById("load-pct"); s += (0.2 - s) * 0.015; window.__load = s; if (f) f.style.width = (s * 100).toFixed(1) + "%"; if (p) p.textContent = Math.floor(s * 100) + "%"; requestAnimationFrame(t); } requestAnimationFrame(t); })();</script>

<script src="lib/three.min.js?v=202610041522"></script>
<script src="lib/GLTFLoader.js?v=202610041522"></script>
<script src="lib/fflate.min.js?v=202610041522"></script>
<script src="lib/FBXLoader.js?v=202610041522"></script>
<script src="js/data.js?v=202610041522"></script>
<script src="js/i18n.js?v=202610041522"></script>
<script src="js/i18n_data.js?v=202610041522"></script>
<script src="js/i18n_data2.js?v=202610041522"></script>
<script src="js/i18n_data3.js?v=202610041522"></script>
<script src="js/i18n_data4.js?v=202610041522"></script>
<script src="js/i18n_data5.js?v=202610041522"></script>
<script src="js/i18n_data6.js?v=202610041522"></script>
<script src="js/i18n_data7.js?v=202610041522"></script>
<script src="js/i18n_data8.js?v=202610041522"></script>
<script src="js/icons.js?v=202610041522"></script>
<script src="js/sdk.js?v=202610041522"></script>
<script src="js/assetload.js?v=202610041522"></script>
<script src="js/audio.js?v=202610041522"></script>
<script src="js/music.js?v=202610041522"></script>
<script src="js/input.js?v=202610041522"></script>
<script src="js/voxels.js?v=202610041522"></script>
<script src="js/buildings.js?v=202610041522"></script>
<script src="js/world.js?v=202610041522"></script>
<script src="js/looks.js?v=202610041522"></script>
<script src="js/remote.js?v=202610041522"></script>
<script src="js/armsdata.js?v=202610041522"></script>
<script src="js/arms.js?v=202610041522"></script>
<script src="js/player.js?v=202610041522"></script>
<script src="js/net.js?v=202610041522"></script>
<script src="js/game.js?v=202610041522"></script>
<script src="js/quests.js?v=202610041522"></script>
<script src="js/monsters.js?v=202610041522"></script>
<script src="js/ui.js?v=202610041522"></script>
<script src="js/cinema.js?v=202610041522"></script>
<script src="js/main.js?v=202610041522"></script>
</body>
</html>
